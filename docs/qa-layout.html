<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AFX layout checks</title><style>body{margin:0;background:#252525;color:#eee;font:13px system-ui}header{display:flex;gap:12px;align-items:center;padding:12px;height:36px}button,select{background:#444;color:#fff;border:1px solid #777;padding:6px}#stage{position:relative;overflow:hidden;margin:0 20px;background:#050505}iframe{border:0;display:block;transform-origin:top left}output{display:block;padding:12px;font:12px monospace;white-space:pre-wrap}</style></head><body><header><label>Viewport <select id="viewport"><option>375x812</option><option>430x932</option><option>768x1024</option><option>1366x768</option><option selected>1440x900</option><option>1920x1080</option><option>2560x1440</option></select></label><label>Section <select id="section"><option>home</option><option>manifesto</option><option>about</option><option>system</option><option>process</option><option>work</option><option>build-log</option><option>journey</option><option>contact</option></select></label><button id="jump">Go to section</button><button id="audit">Check layout</button><label>Scene <select id="scene"><option value="0">Stillness</option><option value="1">Approach</option><option value="2">Clash</option><option value="3">Strike</option><option value="4">After the storm</option></select></label><button id="scene-jump">Preview scene</button></header><div id="stage"><iframe id="preview" title="Portfolio viewport" src="/"></iframe></div><output id="report">Choose a viewport and check the layout.</output><script>
const frame=document.querySelector('iframe'),box=document.querySelector('#stage'),viewport=document.querySelector('#viewport');
function resize(){const [w,h]=viewport.value.split('x').map(Number);const scale=Math.min((window.innerWidth-40)/w,(window.innerHeight-135)/h,1);frame.width=w;frame.height=h;frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';box.style.width=w*scale+'px';box.style.height=h*scale+'px'}
viewport.addEventListener('change',resize);window.addEventListener('resize',resize);resize();
document.querySelector('#jump').onclick=()=>{frame.contentDocument.getElementById(document.querySelector('#section').value)?.scrollIntoView({behavior:'instant'})};
document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;const all=[...d.querySelectorAll('main a,main button,main img,main h1,main h2,main h3,main p,main section')];const overflow=all.filter(e=>!e.closest('[aria-hidden=true],.kata-window')).filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+2||r.left<-2)}).map(e=>({tag:e.tagName,cls:e.className,text:e.textContent?.trim().slice(0,50),rect:{left:Math.round(e.getBoundingClientRect().left),right:Math.round(e.getBoundingClientRect().right)}}));const bad=[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src);document.querySelector('#report').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],scrollY:Math.round(w.scrollY),sheathed:d.querySelector('.cinematic-backdrop')?.dataset.sheathed,duelScene:d.querySelector('.scroll-duel')?.dataset.scene,documentWidth:d.documentElement.scrollWidth,viewportWidth:d.documentElement.clientWidth,overflow:overflow.slice(0,12),brokenImages:bad},null,2)};
document.querySelector('#scene-jump').onclick=()=>{const w=frame.contentWindow;const el=frame.contentDocument.querySelector('.work-scene');const index=Number(document.querySelector('#scene').value);const top=el.getBoundingClientRect().top+w.scrollY;w.scrollTo({top:top+(el.offsetHeight-w.innerHeight)*((index+.35)/5),behavior:'instant'})};
</script></body></html>
